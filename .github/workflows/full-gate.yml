name: Full gate

# infra/test-docker.sh end to end: integration pytest against Postgres, Redis and
# Elasticsearch, migrations, the restore rehearsal, the frontend build and every
# Playwright browser group. Too slow for every PR, so it runs after each merge to main,
# nightly, on demand, and on PRs that change the test or container setup itself. A push that
# changes nothing but the Markdown docs, the README's images or the licence starts no run.
# Run on demand, it can instead run one targeted loop (one browser group, or named integration
# tests), so a session that cannot run Docker can check a fix without the whole gate.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - assets/**
      - LICENSE
  pull_request:
    paths:
      - .github/workflows/full-gate.yml
      - .github/actions/**
      - infra/**
      - docker/**
      - backend/Dockerfile*
      - frontend/Dockerfile*
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: >-
          What to run: full is infra/test-docker.sh; e2e is one browser group
          (infra/test-e2e.sh); integration is the named integration tests
          (infra/test-integration.sh).
        type: choice
        default: full
        options:
          - full
          - e2e
          - integration
      target:
        description: >-
          e2e: the group (search, investigations, monitors or graph). integration: the
          pytest node ids, separated by spaces. Ignored for full.
        type: string
        default: ""
      stop_after:
        description: e2e only, optional. Stop the group after this spec (--stop-after).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A targeted run has its own group, so it neither waits behind nor cancels a full run.
  group: full-gate-${{ github.ref }}-${{ inputs.run || 'full' }}-${{ inputs.target }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    name: Full gate (infra/test-docker.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.test.yaml
          targets: |
            backend-test
            frontend-test
          scope: test
      # The integration loop builds only the test images.
      - if: inputs.run != 'integration'
        uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.yaml
          targets: |
            api
            frontend
          scope: runtime
      # Of the browser groups, only graph runs the NER image.
      - if: inputs.run != 'integration' && (inputs.run != 'e2e' || inputs.target == 'graph')
        uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.yaml
            compose.ner.yaml
          targets: |
            api
          scope: runtime-ner
      - name: Run the selected tests
        env:
          RUN: ${{ inputs.run || 'full' }}
          TARGET: ${{ inputs.target }}
          STOP_AFTER: ${{ inputs.stop_after }}
          NEWSINTEL_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
          NEWSINTEL_E2E_ARTIFACTS: ${{ runner.temp }}/test-artifacts
        run: |
          case $RUN in
            full) ./infra/test-docker.sh ;;
            e2e)
              case $TARGET in
                search | investigations | monitors | graph) ;;
                *) echo "::error::e2e needs target search, investigations, monitors or graph"; exit 2 ;;
              esac
              if [ -n "$STOP_AFTER" ]; then
                ./infra/test-e2e.sh --stop-after "$STOP_AFTER" "$TARGET"
              else
                ./infra/test-e2e.sh "$TARGET"
              fi
              ;;
            integration)
              [ -n "$TARGET" ] || { echo "::error::integration needs pytest node ids in target"; exit 2; }
              # One argument per node id; set -f keeps a parametrized id's [...] from globbing.
              set -f
              # shellcheck disable=SC2086
              ./infra/test-integration.sh $TARGET
              ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gate-artifacts
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
