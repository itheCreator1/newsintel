name: Full gate

# infra/test-docker.sh end to end: integration pytest against Postgres, Redis and
# Elasticsearch, migrations, the restore rehearsal, the frontend build and every
# Playwright browser group. Too slow for every PR, so it runs after each merge to main,
# nightly, on demand, and on PRs that change the test or container setup itself. A push that
# changes nothing but the Markdown docs, the README's images or the licence starts no run.
# Run on demand, it can instead run one targeted loop (one browser group, or named integration
# tests) through infra/test-ci.sh; targeted.yml does the same from a commit trailer.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - assets/**
      - LICENSE
  pull_request:
    paths:
      - .github/workflows/full-gate.yml
      - .github/actions/**
      - infra/**
      - docker/**
      - backend/Dockerfile*
      - frontend/Dockerfile*
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: >-
          What to run: full is infra/test-docker.sh; e2e is one browser group
          (infra/test-e2e.sh); integration is the named integration tests
          (infra/test-integration.sh).
        type: choice
        default: full
        options:
          - full
          - e2e
          - integration
      target:
        description: >-
          e2e: the group (search, investigations, monitors or graph). integration: the
          pytest node ids, separated by spaces. Ignored for full.
        type: string
        default: ""
      stop_after:
        description: e2e only, optional. Stop the group after this spec (--stop-after).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A targeted run has its own group, so it neither waits behind nor cancels a full run.
  group: full-gate-${{ github.ref }}-${{ inputs.run || 'full' }}-${{ inputs.target }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  same-tree:
    # A merge to main whose tree already passed the full gate (on its PR, or from a `ci-run: full`
    # commit) does not run it again. Any doubt (no match, an API error) runs it.
    name: Same tree already green
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/full-gate.yml/runs?status=success&per_page=100" > "$RUNNER_TEMP/full.json" &&
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/targeted.yml/runs?status=success&per_page=100" > "$RUNNER_TEMP/targeted.json" &&
            run=$(python3 infra/ci_green_tree.py "$(git rev-parse 'HEAD^{tree}')" "$RUNNER_TEMP/full.json" "$RUNNER_TEMP/targeted.json") || run=
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "This tree passed the full gate in $run" >> "$GITHUB_STEP_SUMMARY"; fi

  full:
    name: Full gate (infra/test-docker.sh)
    needs: same-tree
    # Runs unless same-tree found a green run; a skipped or failed same-tree job runs it too.
    if: ${{ !cancelled() && needs.same-tree.outputs.run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.test.yaml
          targets: |
            backend-test
            frontend-test
          scope: test
      # The integration loop builds only the test images.
      - if: inputs.run != 'integration'
        uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.yaml
          targets: |
            api
            frontend
          scope: runtime
      # Of the browser groups, only graph runs the NER image.
      - if: inputs.run != 'integration' && (inputs.run != 'e2e' || inputs.target == 'graph')
        uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.yaml
            compose.ner.yaml
          targets: |
            api
          scope: runtime-ner
      - name: Run the selected tests
        env:
          RUN: ${{ inputs.run || 'full' }}
          TARGET: ${{ inputs.target }}
          STOP_AFTER: ${{ inputs.stop_after }}
          NEWSINTEL_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
          NEWSINTEL_E2E_ARTIFACTS: ${{ runner.temp }}/test-artifacts
          # A browser test that fails is retried once; one that then passes is listed as flaky.
          NEWSINTEL_E2E_RETRIES: "1"
        run: |
          # One argument per word of TARGET (a group, or node ids); set -f keeps a
          # parametrized node id's [...] from globbing.
          set -f
          # shellcheck disable=SC2086
          case $RUN in
            full) ./infra/test-ci.sh full ;;
            e2e) ./infra/test-ci.sh e2e $TARGET "$STOP_AFTER" ;;
            *) ./infra/test-ci.sh "$RUN" $TARGET ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gate-artifacts
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore

  report:
    # main and the nightly run keep one issue open while they are red, and close it when green.
    name: Report main's state
    needs: [same-tree, full]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.full.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: main/nightly is red
    steps:
      - run: |
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          case $RESULT in
            failure)
              if [ -n "$issue" ]; then
                gh issue comment "$issue" --body "Still red: $RUN_URL"
              else
                gh issue create --title "$TITLE" --body "The full gate failed on main: $RUN_URL"
              fi ;;
            success|skipped)
              if [ -n "$issue" ]; then gh issue close "$issue" --comment "Green again: $RUN_URL"; fi ;;
          esac
