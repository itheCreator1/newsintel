name: Full gate

# infra/test-docker.sh end to end: integration pytest against Postgres, Redis and
# Elasticsearch, migrations, the restore rehearsal, the frontend build and every
# Playwright browser group. Too slow for every PR, so it runs after each merge to main,
# nightly, on demand, and on PRs that change the test or container setup itself. A push that
# changes nothing but the Markdown docs, the README's images or the licence starts no run.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - assets/**
      - LICENSE
  pull_request:
    paths:
      - .github/workflows/full-gate.yml
      - .github/actions/**
      - infra/**
      - docker/**
      - backend/Dockerfile*
      - frontend/Dockerfile*
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    name: Full gate (infra/test-docker.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.test.yaml
          targets: |
            backend-test
            frontend-test
          scope: test
      - uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.yaml
          targets: |
            api
            frontend
          scope: runtime
      - uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.yaml
            compose.ner.yaml
          targets: |
            api
          scope: runtime-ner
      - run: ./infra/test-docker.sh
        env:
          NEWSINTEL_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-gate-artifacts
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
