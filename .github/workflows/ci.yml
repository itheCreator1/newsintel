name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy app
      - run: uv run --frozen pytest -q -rs tests

  frontend:
    name: Frontend (vitest, tsc, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
