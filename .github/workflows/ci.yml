name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    # Same checks as the local fast loop: ruff, mypy, unit pytest, OpenAPI/TS contract,
    # vitest, tsc. Runs inside the repo's own test images via Docker Compose.
    name: Quick gate (infra/test-quick.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.test.yaml
            compose.quick.yaml
          targets: |
            backend-test
            frontend-test
          scope: test
      - run: ./infra/test-quick.sh
        env:
          NEWSINTEL_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-quick-artifacts
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore

  frontend-build:
    # test-quick.sh skips `npm run build`; the static export is checked here.
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
