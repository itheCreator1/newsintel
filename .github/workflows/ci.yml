name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.9"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy app
      - run: uv run --frozen pytest -q -rs tests

  frontend:
    name: Frontend (vitest, tsc, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  contract:
    name: API contract (OpenAPI and generated types)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.9"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv python install 3.13
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen python -c 'import json; from app.main import create_app; print(json.dumps(create_app().openapi(), indent=2))' > ../frontend/openapi.json
        working-directory: backend
      - run: npm ci && npm run generate:api
        working-directory: frontend
      - name: Fail if the checked-in contract is stale
        run: git diff --exit-code frontend/openapi.json frontend/src/lib/types.generated.ts

  integration:
    name: Backend integration (PostgreSQL, Elasticsearch, fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: newsintel
          POSTGRES_PASSWORD: newsintel
          POSTGRES_DB: newsintel_tests
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U newsintel" --health-interval 5s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
        options: --health-cmd "curl -fsS http://127.0.0.1:9200/_cluster/health" --health-interval 10s --health-retries 30
    env:
      NEWSINTEL_RUN_POSTGRES_TESTS: "1"
      NEWSINTEL_DATABASE_URL: postgresql+asyncpg://newsintel:newsintel@127.0.0.1:5432/newsintel_tests
      NEWSINTEL_ELASTICSEARCH_URL: http://127.0.0.1:9200
      NEWSINTEL_REDIS_URL: redis://127.0.0.1:6379/0
      NEWSINTEL_TEST_FIXTURE_PORT: "18080"
      NEWSINTEL_FEED_TEST_ALLOWED_HOSTS: '["localhost"]'
    defaults:
      run:
        working-directory: backend
        # Explicit bash adds pipefail, so pytest's status survives the tee.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.9"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: python3 tests/fixtures/server.py 18080 > fixture-server.log 2>&1 &
      - run: uv run --frozen python -m alembic upgrade head
      - name: Migration head is 0014
        run: uv run --frozen python -m alembic heads | grep -q '^0014 (head)'
      - name: Gated suite runs with nothing skipped
        run: |
          uv run --frozen python -m pytest -q -rs tests | tee pytest.log
          ! grep -Eq '[0-9]+ skipped' pytest.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: |
            backend/pytest.log
            backend/fixture-server.log
