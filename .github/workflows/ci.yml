name: CI

# A change to nothing but the Markdown docs, the README's images or the licence starts no run:
# no check reads them.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - assets/**
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - assets/**
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    # Same checks as the local fast loop: ruff, mypy, unit pytest, OpenAPI/TS contract,
    # vitest, tsc. Runs inside the repo's own test images via Docker Compose.
    name: Quick gate (infra/test-quick.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/warm-docker-cache
        with:
          files: |
            compose.test.yaml
            compose.quick.yaml
          targets: |
            backend-test
            frontend-test
          scope: test
      - run: ./infra/test-quick.sh
        env:
          NEWSINTEL_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-quick-artifacts
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore

  frontend-build:
    # test-quick.sh skips `npm run build`; the static export is checked here.
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  audit:
    # Known vulnerabilities in the locked dependencies: every Python package uv.lock pins, and the
    # npm packages. A finding with a fixed release is upgraded in the PR.
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.12.9
      - name: pip-audit
        working-directory: backend
        # --no-deps: the export already lists every pinned package, transitive ones included.
        run: |
          uv export --frozen --no-hashes --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: npm audit
        working-directory: frontend
        # What ships in the static export fails at high; the build and test tooling only at critical,
        # since a high finding there can have no fixed release (braces, under shadcn and eslint-config-next).
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
