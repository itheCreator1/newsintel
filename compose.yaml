name: newsintel

services:
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${NEWSINTEL_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    environment: &backend-env
      NEWSINTEL_DATABASE_URL: postgresql+asyncpg://newsintel:${POSTGRES_PASSWORD:-newsintel}@postgres:5432/newsintel
      NEWSINTEL_REDIS_URL: redis://redis:6379/0
      NEWSINTEL_ELASTICSEARCH_URL: http://elasticsearch:9200
      NEWSINTEL_ENVIRONMENT: ${NEWSINTEL_ENVIRONMENT:-development}
      NEWSINTEL_SESSION_COOKIE_SECURE: ${NEWSINTEL_SESSION_COOKIE_SECURE:-false}
      NEWSINTEL_SECRET_KEY: ${NEWSINTEL_SECRET_KEY:-development-only-change-me}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: ["dramatiq", "app.jobs.diagnostics", "app.jobs.ingestion", "--processes", "1", "--threads", "4"]
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  scheduler:
    build: ./backend
    command: ["python", "-m", "app.scheduler"]
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: newsintel
      POSTGRES_USER: newsintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsintel}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsintel -d newsintel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
