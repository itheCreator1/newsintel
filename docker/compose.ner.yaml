services:
  api:
    build:
      context: ../backend
      args:
        NEWSINTEL_INSTALL_SPACY: "true"
    image: ${NEWSINTEL_IMAGE_BACKEND_NER:-newsintel-backend-ner:local}
    environment:
      NEWSINTEL_NLP_NER_ENABLED: "true"

  nlp-worker:
    build:
      context: ../backend
      args:
        NEWSINTEL_INSTALL_SPACY: "true"
    image: ${NEWSINTEL_IMAGE_BACKEND_NER:-newsintel-backend-ner:local}
    environment:
      NEWSINTEL_NLP_NER_ENABLED: "true"
