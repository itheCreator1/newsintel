name: newsintel

services:
  frontend:
    build: ../frontend
    ports: ["127.0.0.1:${NEWSINTEL_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ../backend
    environment: &backend-env
      NEWSINTEL_DATABASE_URL: postgresql+asyncpg://newsintel:${POSTGRES_PASSWORD:-newsintel}@postgres:5432/newsintel
      NEWSINTEL_REDIS_URL: redis://redis:6379/0
      NEWSINTEL_ELASTICSEARCH_URL: http://elasticsearch:9200
      NEWSINTEL_ENVIRONMENT: ${NEWSINTEL_ENVIRONMENT:-development}
      NEWSINTEL_SESSION_COOKIE_SECURE: ${NEWSINTEL_SESSION_COOKIE_SECURE:-false}
      NEWSINTEL_SECRET_KEY: ${NEWSINTEL_SECRET_KEY:-development-only-change-me}
      NEWSINTEL_FEED_USER_AGENT: ${NEWSINTEL_FEED_USER_AGENT:-NewsIntel/0.2 (+self-hosted RSS archive)}
      NEWSINTEL_FEED_TIMEOUT_SECONDS: ${NEWSINTEL_FEED_TIMEOUT_SECONDS:-20}
      NEWSINTEL_FEED_MAX_RESPONSE_BYTES: ${NEWSINTEL_FEED_MAX_RESPONSE_BYTES:-5000000}
      NEWSINTEL_FEED_REDIRECT_LIMIT: ${NEWSINTEL_FEED_REDIRECT_LIMIT:-5}
      NEWSINTEL_FEED_HOST_MIN_INTERVAL_SECONDS: ${NEWSINTEL_FEED_HOST_MIN_INTERVAL_SECONDS:-1}
      NEWSINTEL_ARTICLE_TIMEOUT_SECONDS: ${NEWSINTEL_ARTICLE_TIMEOUT_SECONDS:-20}
      NEWSINTEL_ARTICLE_MAX_RESPONSE_BYTES: ${NEWSINTEL_ARTICLE_MAX_RESPONSE_BYTES:-5000000}
      NEWSINTEL_ARTICLE_REDIRECT_LIMIT: ${NEWSINTEL_ARTICLE_REDIRECT_LIMIT:-5}
      NEWSINTEL_ARTICLE_HOST_MIN_INTERVAL_SECONDS: ${NEWSINTEL_ARTICLE_HOST_MIN_INTERVAL_SECONDS:-1}
      NEWSINTEL_ARTICLE_TEMPORARY_HTML_HOURS: ${NEWSINTEL_ARTICLE_TEMPORARY_HTML_HOURS:-24}
      NEWSINTEL_ARTICLE_STORAGE_PATH: /var/lib/newsintel/articles
      NEWSINTEL_NLP_NER_ENABLED: ${NEWSINTEL_NLP_NER_ENABLED:-false}
      NEWSINTEL_NLP_NER_MODEL: ${NEWSINTEL_NLP_NER_MODEL:-en_core_web_sm}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ../backend
    command: ["dramatiq", "app.jobs.diagnostics", "app.jobs.ingestion", "app.jobs.articles", "app.jobs.search", "app.jobs.monitors", "--processes", "1", "--threads", "4"]
    environment: *backend-env
    volumes: ["article-data:/var/lib/newsintel/articles"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  nlp-worker:
    build: ../backend
    command:
      ["dramatiq", "app.jobs.nlp", "app.jobs.clustering", "app.jobs.events", "--processes", "1", "--threads", "1"]
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  scheduler:
    build: ../backend
    command: ["python", "-m", "app.scheduler"]
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: newsintel
      POSTGRES_USER: newsintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsintel}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U newsintel -d newsintel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  article-data:
