# Wikidata is the fixture server's stand-in, never www.wikidata.org; the candidate sweep is kept
# off so only the spec's button asks it. 1 s is the client's floor between requests.
x-wikidata: &wikidata
  NEWSINTEL_WIKIDATA_URL: http://fixture/w/api.php
  NEWSINTEL_WIKIDATA_CONTACT: e2e-tests@example.org
  NEWSINTEL_WIKIDATA_MIN_INTERVAL_SECONDS: 1
  NEWSINTEL_WIKIDATA_CANDIDATE_MIN_ARTICLES: 1000000

services:
  api:
    environment:
      NEWSINTEL_FEED_TEST_ALLOWED_HOSTS: '["fixture"]'
      <<: *wikidata
  worker:
    environment:
      NEWSINTEL_FEED_TEST_ALLOWED_HOSTS: '["fixture"]'
      <<: *wikidata
      NEWSINTEL_ARTICLE_HOST_MIN_INTERVAL_SECONDS: 0
      # Monitor tests need a few evaluation ticks in minutes, not hours; settle stays above indexing latency.
      NEWSINTEL_MONITOR_INTERVAL_SECONDS: 5
      NEWSINTEL_MONITOR_SETTLE_SECONDS: 10
  scheduler:
    command: ["python", "-c", "import asyncio; from app.scheduler import run_scheduler; asyncio.run(run_scheduler(0.5))"]
    environment:
      NEWSINTEL_FEED_TEST_ALLOWED_HOSTS: '["fixture"]'
      <<: *wikidata
  postgres:
    ports: ["127.0.0.1:${NEWSINTEL_TEST_POSTGRES_PORT:-55432}:5432"]
  # Default 0 lets the kernel pick a free port when NEWSINTEL_TEST_ELASTICSEARCH_PORT is unset.
  elasticsearch:
    ports: ["127.0.0.1:${NEWSINTEL_TEST_ELASTICSEARCH_PORT:-0}:9200"]
  fixture:
    image: python:3.13-alpine
    command: ["python", "/fixtures/server.py"]
    ports: ["127.0.0.1:${NEWSINTEL_TEST_FIXTURE_PORT:-18080}:80"]
    volumes: ["../backend/tests/fixtures:/fixtures:ro"]
