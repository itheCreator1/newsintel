server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # trailingSlash:true's per-route directories make nginx's own directory-index redirect (e.g. /search ->
  # /search/) fire on every route; that redirect otherwise hardcodes nginx's own listen port (8080) into
  # the Location header, sending clients to the wrong origin whenever the externally mapped port differs
  # (any docker-compose port remap, including the e2e acceptance stacks, which use a random host port).
  absolute_redirect off;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
