server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # trailingSlash:true's per-route directories make nginx's own directory-index redirect (e.g. /search ->
  # /search/) fire on every route; that redirect otherwise hardcodes nginx's own listen port (8080) into
  # the Location header, sending clients to the wrong origin whenever the externally mapped port differs
  # (any docker-compose port remap, including the e2e acceptance stacks, which use a random host port).
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # add_header is not inherited by a block that declares its own, so each location that sets
  # Cache-Control repeats these three.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Content-hashed by the build, so a changed file always has a new name.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
  }

  location / {
    # Pages are revalidated, so a new build is picked up without a hard refresh.
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
