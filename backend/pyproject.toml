[project]
name = "newsintel-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.32.0,<1",
  "dramatiq[redis]>=1.17,<3",
  "defusedxml>=0.7,<1",
  "fastapi>=0.143.0,<1",
  "httpx>=0.28,<1",
  "lingua-language-detector==2.2.0",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "trafilatura>=2.3.1,<3",
  "uvicorn[standard]>=0.34,<1",
  "yake==0.7.3",
]

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.0,<1",
  "shellcheck-py>=0.11.0.1",
]
# Optional spaCy NER, installed in the image only when NEWSINTEL_INSTALL_SPACY=true.
ner = [
  "spacy==3.8.16",
  "en-core-web-sm==3.8.0",
  "el-core-news-sm==3.8.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
el-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/el_core_news_sm-3.8.0/el_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C901"]

[tool.ruff.lint.mccabe]
# The functions over this limit when it came in carry `noqa: C901`; split one and drop its noqa.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test fakes and schema walkers branch on what they inspect; the limit is for app code.
"tests/**" = ["C901"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Import contracts, checked by `lint-imports` in the quick gate. They report without failing the gate
# until the fix plan makes them binding: the routes contract in step B1, the layers in step E10.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Only app.main imports a package's routes"
type = "protected"
protected_modules = ["app.*.routes"]
allowed_importers = ["app.main"]
ignore_imports = [
    # The session dependency lives beside the auth routes today; B1 moves it out.
    "app.auth.dependencies -> app.auth.routes",
]

[[tool.importlinter.contracts]]
name = "Entry points, then jobs, then the feature packages, then db, then core"
type = "layers"
layers = [
    "app.main | app.cli | app.scheduler",
    "app.jobs",
    "app.analytics : app.articles : app.auth : app.clustering : app.compare : app.entities : app.events : app.exports : app.feeds : app.geo : app.graph : app.investigations : app.marks : app.monitors : app.nlp : app.notifications : app.operations : app.processes : app.search : app.sources : app.wikidata : app.api",
    "app.db",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "Inside a package: routes above its service, the service above its models"
type = "layers"
containers = [
    "app.auth",
    "app.clustering",
    "app.events",
    "app.feeds",
    "app.investigations",
    "app.marks",
    "app.monitors",
    "app.nlp",
    "app.notifications",
    "app.operations",
    "app.search",
    "app.wikidata",
]
layers = ["routes", "(service)", "models"]
