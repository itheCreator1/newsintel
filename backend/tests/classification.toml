# Per-module test classification for backend/tests/*.py, used by classify.py to derive
# test-quick.sh's unit selection and test-integration.sh's service requirements.
#
# Derived by grepping every test_*.py module's source for its actual skip-gate markers
# (NEWSINTEL_RUN_POSTGRES_TESTS, NEWSINTEL_TEST_FIXTURE_PORT) and, for Elasticsearch, by
# reading each Postgres-gated module that mentions "elasticsearch" to tell a real live-cluster
# call apart from a monkeypatched exception or a graceful-degradation assertion -- not from
# filename convention. Verified against `pytest --collect-only` (594 collected, 75 modules).
#
# kind: "unit" (no service flags) or "integration" (Postgres-gated, kind implied by postgres).
# postgres/elasticsearch/fixture_server: true iff the module's source requires that service.
# elasticsearch=true is human-audited in one direction only (source mentions "Elasticsearch");
# the reverse isn't checked here since some Postgres-gated modules mention it while testing
# graceful degradation without a live cluster -- test-integration.sh backstops a wrong `false`
# by pointing NEWSINTEL_ELASTICSEARCH_URL at http://127.0.0.1:1 whenever no selected module
# declares elasticsearch, so a missed `true` fails loudly instead of silently passing.
# note: optional, used for filename-convention exceptions and audited elasticsearch=false calls.
"test_analytics_elasticsearch.py" = { kind = "integration", postgres = true, elasticsearch = true, fixture_server = false }
"test_analytics_routes.py" = { kind = "unit", postgres = false, elasticsearch = false, fixture_server = false }
